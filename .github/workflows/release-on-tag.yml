name: Create Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get image tag
        uses: mikefarah/yq@master
        id: image_tag
        with:
          cmd: yq '.services.ollama.image' docker-compose.yml | cut -d':' -f 2
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.image_tag.outputs.result }}
          body: Automated deployment